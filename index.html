<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Penunjuk Arah Ruangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="setting-page">
            <div class="header">
                <h1>AR Penunjuk Arah</h1>
                <p class="subtitle">Gedung Kampus</p>
            </div>
            
            <div class="content">
                <div class="form-group">
                    <label for="roomSelect">Pilih Ruang Tujuan</label>
                    <select id="roomSelect" class="input-select">
                        <option value="">-- Pilih Ruangan --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="startFloorSelect">Lantai Awal Anda</label>
                    <select id="startFloorSelect" class="input-select">
                        <option value="1">Lantai 1</option>
                        <option value="2">Lantai 2</option>
                        <option value="3">Lantai 3</option>
                    </select>
                </div>
                
                <div class="preview-box">
                    <h3>Preview Navigasi</h3>
                    <div class="preview-content">
                        <div class="preview-item">
                            <span class="preview-label">Ruang Tujuan:</span>
                            <span class="preview-value" id="previewRoom">-</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Lantai Tujuan:</span>
                            <span class="preview-value" id="previewTargetFloor">-</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Lantai Awal:</span>
                            <span class="preview-value" id="previewStartFloor">-</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Instruksi:</span>
                            <span class="preview-value" id="previewInstruction">-</span>
                        </div>
                    </div>
                </div>
                
                <button id="startARBtn" class="btn-primary" disabled>
                    <span>📷</span> Mulai AR
                </button>
                
                <div class="info-box">
                    <div class="info-title">💡 Catatan Penting</div>
                    <ul>
                        <li>Izinkan akses kamera</li>
                        <li>Siapkan marker HIRO</li>
                        <li>Gunakan pencahayaan cukup</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
